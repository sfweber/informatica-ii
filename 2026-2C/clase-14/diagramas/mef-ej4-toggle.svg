<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<title>Ejercicio 4 - toggle</title>
<defs>
  <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#455A64"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="34" y="40" font-size="19" font-weight="700" fill="#212121">Ejercicio 4 — un boton que ALTERNA el LED</text><text x="34" y="60" font-size="13" fill="#607D8B">Moore: la salida depende SOLO del estado. El boton no dice "prendete", dice "cambiate".</text><text x="34.0" y="376" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">evento</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[guarda]</tspan><tspan fill="#212121"> </tspan><tspan fill="#C62828">/ accion</tspan><tspan fill="#78909C">     la guarda LEE, la accion ESCRIBE</tspan></text><rect x="150" y="150" rx="14" ry="14" width="250" height="80" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="275.0" y="184.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">LED_APAGADO</text><text x="208.7" y="207.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / LED = OFF</tspan></text><circle cx="110" cy="190.0" r="7" fill="#455A64"/><line x1="117" y1="190.0" x2="144" y2="190.0" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><rect x="600" y="150" rx="14" ry="14" width="250" height="80" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="725.0" y="184.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">LED_ENCENDIDO</text><text x="662.6" y="207.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / LED = ON</tspan></text><path d="M400,176 L592,176" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="432.8" y="128" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">BOTON_PRESIONADO</tspan></text><path d="M600,206 L408,206" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="432.8" y="262" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">BOTON_PRESIONADO</tspan></text><text x="176.3" y="308" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#607D8B">El evento BOTON_PRESIONADO lo produce leerBoton(): ya viene con el rebote filtrado.</tspan></text>
</svg>
