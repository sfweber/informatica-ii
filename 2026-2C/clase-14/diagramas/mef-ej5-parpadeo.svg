<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="34" y="40" font-size="19" font-weight="700" fill="#212121">Ejercicio 5 — apagado → encendido → parpadeando</text><text x="34" y="60" font-size="13" fill="#607D8B">El estado PARPADEANDO tiene su PROPIO reloj: after(500 ms) sobre si mismo. Ningun delay() en todo el sketch.</text><text x="34.0" y="476" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">evento</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[guarda]</tspan><tspan fill="#212121"> </tspan><tspan fill="#C62828">/ accion</tspan><tspan fill="#78909C">     la guarda LEE, la accion ESCRIBE</tspan></text><rect x="90" y="200" rx="14" ry="14" width="250" height="84" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="215.0" y="236.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">APAGADO</text><text x="148.7" y="259.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / LED = OFF</tspan></text><circle cx="50" cy="242.0" r="7" fill="#455A64"/><line x1="57" y1="242.0" x2="84" y2="242.0" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><rect x="445" y="200" rx="14" ry="14" width="250" height="84" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="570.0" y="236.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">ENCENDIDO</text><text x="507.6" y="259.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / LED = ON</tspan></text><rect x="820" y="200" rx="14" ry="14" width="400" height="84" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="1020.0" y="236.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">PARPADEANDO</text><text x="836.7" y="259.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / LED = ledState, timeParpadeo = millis()</tspan></text><path d="M340,232 L437,232" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="325.3" y="160" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">BOTON_PRESIONADO</tspan></text><path d="M695,232 L812,232" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="690.3" y="160" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">BOTON_PRESIONADO</tspan></text><text x="694.5" y="178" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ ledState = ON</tspan></text><path d="M1020.0,284 L1020.0,346 L215.0,346 L215.0,292" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="587.8" y="370" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">BOTON_PRESIONADO</tspan></text><path d="M1160,200 C1260,104 810,104 880,192" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="965.4" y="84" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">after(500 ms)</tspan></text><text x="927.6" y="102" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ ledState = !ledState</tspan></text>
</svg>
