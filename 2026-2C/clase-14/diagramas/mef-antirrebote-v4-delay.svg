<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="34" y="40" font-size="19" font-weight="700" fill="#212121">Antirrebote de un pulsador — 4 estados (v4: con delay)</text><text x="34" y="60" font-size="13" fill="#607D8B">ejemplo3_v4_FSM. La espera es un delay(40 ms) que vive ADENTRO del estado y bloquea. Pull-down externo: presionado = HIGH.</text><text x="34.0" y="640" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">evento</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[guarda]</tspan><tspan fill="#212121"> </tspan><tspan fill="#C62828">/ accion</tspan><tspan fill="#78909C">     la guarda LEE, la accion ESCRIBE</tspan></text><rect x="170" y="170" rx="14" ry="14" width="268" height="74" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="304.0" y="213.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonUp</text><circle cx="130" cy="207.0" r="7" fill="#455A64"/><line x1="137" y1="207.0" x2="164" y2="207.0" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><rect x="760" y="170" rx="14" ry="14" width="268" height="74" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="894.0" y="201.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonPressing</text><text x="816.0" y="224.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / delay(40 ms)</tspan></text><rect x="760" y="420" rx="14" ry="14" width="268" height="74" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="894.0" y="463.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonDown</text><rect x="170" y="420" rx="14" ry="14" width="268" height="74" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="304.0" y="451.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonReleasing</text><text x="226.0" y="474.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / delay(40 ms)</tspan></text><path d="M438,194 L752,194" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="510.8" y="136" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">muestra</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == HIGH]</tspan></text><path d="M760,222 L446,222" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="515.0" y="274" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">muestra</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == LOW]</tspan></text><text x="552.2" y="292" text-anchor="start" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#78909C">era un rebote</tspan></text><path d="M983,244 L983,412" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="791.6" y="322.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">muestra</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == HIGH]</tspan></text><text x="884.0" y="340.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ LED = ON</tspan></text><path d="M760,444 L446,444" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="515.0" y="374" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">muestra</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == LOW]</tspan></text><path d="M438,472 L752,472" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="510.8" y="524" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">muestra</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == HIGH]</tspan></text><text x="552.2" y="542" text-anchor="start" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#78909C">era un rebote</tspan></text><path d="M215,420 L215,252" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="230.0" y="322.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">muestra</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == LOW]</tspan></text><text x="230.0" y="340.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ LED = OFF</tspan></text><text x="34.0" y="612" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">el delay BLOQUEA: durante esos 40 ms el loop() no puede hacer nada mas</tspan></text>
