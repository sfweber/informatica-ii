<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="664" viewBox="0 0 1180 664" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<title>Antirrebote de un pulsador — 4 estados (v4: con delay)</title>
<defs>
  <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#455A64"/>
  </marker>
