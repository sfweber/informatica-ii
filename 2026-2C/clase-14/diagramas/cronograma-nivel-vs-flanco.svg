<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<title>Nivel vs flanco</title>
<defs>
  <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#455A64"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="34" y="40" font-size="19" font-weight="700" fill="#212121">Nivel o flanco: dos preguntas distintas sobre el mismo boton</text><text x="34" y="60" font-size="13" fill="#607D8B">&quot;¿Esta apretado?&quot; es el NIVEL. &quot;¿Acaba de apretarse?&quot; es el FLANCO, y para verlo hay que recordar el valor anterior.</text><line x1="250" y1="164" x2="1150" y2="164" stroke="#CFD8DC" stroke-width="1"/><line x1="250" y1="110" x2="1150" y2="110" stroke="#ECEFF1" stroke-width="1"/><text x="236" y="139.0" text-anchor="end" font-size="14" font-weight="600" fill="#212121">boton</text><text x="236" y="155.0" text-anchor="end" font-size="12" fill="#78909C">ya sin rebote</text><path d="M250.0,164.0 L385.0,164.0 L385.0,110.0 L565.0,110.0 L565.0,164.0 L790.0,164.0 L790.0,110.0 L970.0,110.0 L970.0,164.0 L1150.0,164.0" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linejoin="miter"/><line x1="250" y1="269" x2="1150" y2="269" stroke="#CFD8DC" stroke-width="1"/><line x1="250" y1="215" x2="1150" y2="215" stroke="#ECEFF1" stroke-width="1"/><text x="236" y="244.0" text-anchor="end" font-size="14" font-weight="600" fill="#212121">v0 / v2</text><text x="236" y="260.0" text-anchor="end" font-size="12" fill="#78909C">el LED sigue el NIVEL</text><path d="M250.0,269.0 L385.0,269.0 L385.0,215.0 L565.0,215.0 L565.0,269.0 L790.0,269.0 L790.0,215.0 L970.0,215.0 L970.0,269.0 L1150.0,269.0" fill="none" stroke="#455A64" stroke-width="2.5" stroke-linejoin="miter"/><line x1="250" y1="374" x2="1150" y2="374" stroke="#CFD8DC" stroke-width="1"/><line x1="250" y1="320" x2="1150" y2="320" stroke="#ECEFF1" stroke-width="1"/><text x="236" y="349.0" text-anchor="end" font-size="14" font-weight="600" fill="#212121">ej. 4</text><text x="236" y="365.0" text-anchor="end" font-size="12" fill="#78909C">el LED cambia en el FLANCO ↑</text><path d="M250.0,374.0 L385.0,374.0 L385.0,320.0 L790.0,320.0 L790.0,374.0 L1150.0,374.0" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linejoin="miter"/><line x1="385.0" y1="94" x2="385.0" y2="382" stroke="#EF6C00" stroke-width="1.5" stroke-dasharray="5,4"/><text x="385.0" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#EF6C00">↑</text><line x1="790.0" y1="94" x2="790.0" y2="382" stroke="#EF6C00" stroke-width="1.5" stroke-dasharray="5,4"/><text x="790.0" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#EF6C00">↑</text><line x1="565.0" y1="102" x2="565.0" y2="277" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="3,4"/><line x1="970.0" y1="102" x2="970.0" y2="277" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="3,4"/><line x1="250" y1="430" x2="1150" y2="430" stroke="#455A64" stroke-width="1.5"/><line x1="250.0" y1="430" x2="250.0" y2="436" stroke="#455A64" stroke-width="1.5"/><text x="250.0" y="452" text-anchor="middle" font-size="12" fill="#607D8B">0</text><line x1="430.0" y1="430" x2="430.0" y2="436" stroke="#455A64" stroke-width="1.5"/><text x="430.0" y="452" text-anchor="middle" font-size="12" fill="#607D8B">20</text><line x1="610.0" y1="430" x2="610.0" y2="436" stroke="#455A64" stroke-width="1.5"/><text x="610.0" y="452" text-anchor="middle" font-size="12" fill="#607D8B">40</text><line x1="790.0" y1="430" x2="790.0" y2="436" stroke="#455A64" stroke-width="1.5"/><text x="790.0" y="452" text-anchor="middle" font-size="12" fill="#607D8B">60</text><line x1="970.0" y1="430" x2="970.0" y2="436" stroke="#455A64" stroke-width="1.5"/><text x="970.0" y="452" text-anchor="middle" font-size="12" fill="#607D8B">80</text><line x1="1150.0" y1="430" x2="1150.0" y2="436" stroke="#455A64" stroke-width="1.5"/><text x="1150.0" y="452" text-anchor="middle" font-size="12" fill="#607D8B">100</text><text x="1160" y="452" font-size="12" fill="#607D8B">ms</text><text x="34.0" y="498" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#607D8B">El flanco no es un estado: existe en un instante. Por eso hace falta </tspan><tspan fill="#212121">oldValue</tspan><tspan fill="#607D8B"> — y por eso v1, que no lo actualiza, no ve el segundo flanco.</tspan></text>
</svg>
