<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<title>El rebote del pulsador</title>
<defs>
  <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#455A64"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="34" y="40" font-size="19" font-weight="700" fill="#212121">El rebote: una pulsacion, muchos flancos</text><text x="34" y="60" font-size="13" fill="#607D8B">Las laminas del contacto chocan durante 1 a 10 ms. Wokwi lo simula con &quot;bounce&quot;: &quot;1&quot; en el pulsador.</text><line x1="250" y1="164" x2="1150" y2="164" stroke="#CFD8DC" stroke-width="1"/><line x1="250" y1="110" x2="1150" y2="110" stroke="#ECEFF1" stroke-width="1"/><text x="236" y="139.0" text-anchor="end" font-size="14" font-weight="600" fill="#212121">pin 8</text><text x="236" y="155.0" text-anchor="end" font-size="12" fill="#78909C">lo que ve digitalRead()</text><path d="M250.0,164.0 L400.0,164.0 L407.5,164.0 L407.5,110.0 L415.0,110.0 L415.0,164.0 L422.5,164.0 L422.5,110.0 L430.0,110.0 L430.0,164.0 L437.5,164.0 L437.5,110.0 L445.0,110.0 L445.0,164.0 L452.5,164.0 L452.5,110.0 L460.0,110.0 L460.0,164.0 L467.5,164.0 L467.5,110.0 L475.0,110.0 L1150.0,110.0" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linejoin="miter"/><text x="355" y="180" text-anchor="end" font-size="12" fill="#78909C">suelto (pull-down: 0 V)</text><text x="550" y="102" font-size="12" fill="#78909C">presionado (5 V)</text><rect x="400.0" y="100" width="75.0" height="74" fill="#EF6C00" opacity="0.10"/><text x="438" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#EF6C00">rebote ~5 ms</text><line x1="250" y1="284" x2="1150" y2="284" stroke="#CFD8DC" stroke-width="1"/><line x1="250" y1="230" x2="1150" y2="230" stroke="#ECEFF1" stroke-width="1"/><text x="236" y="259.0" text-anchor="end" font-size="14" font-weight="600" fill="#212121">LED con v2</text><text x="236" y="275.0" text-anchor="end" font-size="12" fill="#78909C">sin antirrebote</text><path d="M250.0,284.0 L400.0,284.0 L407.5,284.0 L407.5,230.0 L415.0,230.0 L415.0,284.0 L422.5,284.0 L422.5,230.0 L430.0,230.0 L430.0,284.0 L437.5,284.0 L437.5,230.0 L445.0,230.0 L445.0,284.0 L452.5,284.0 L452.5,230.0 L460.0,230.0 L460.0,284.0 L467.5,284.0 L467.5,230.0 L475.0,230.0 L1150.0,230.0" fill="none" stroke="#C62828" stroke-width="2.5" stroke-linejoin="miter"/><text x="580" y="262.0" font-size="13" fill="#C62828">el LED copia TODOS los rebotes</text><line x1="250" y1="404" x2="1150" y2="404" stroke="#CFD8DC" stroke-width="1"/><line x1="250" y1="350" x2="1150" y2="350" stroke="#ECEFF1" stroke-width="1"/><text x="236" y="379.0" text-anchor="end" font-size="14" font-weight="600" fill="#212121">LED con v3 / v5</text><text x="236" y="395.0" text-anchor="end" font-size="12" fill="#78909C">antirrebote de 40 ms</text><path d="M250.0,404.0 L1000.0,404.0 L1000.0,350.0 L1150.0,350.0" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linejoin="miter"/><line x1="400.0" y1="96" x2="400.0" y2="414" stroke="#EF6C00" stroke-width="1.5" stroke-dasharray="5,4"/><line x1="1000.0" y1="96" x2="1000.0" y2="414" stroke="#EF6C00" stroke-width="1.5" stroke-dasharray="5,4"/><line x1="400.0" y1="430" x2="1000.0" y2="430" stroke="#EF6C00" stroke-width="1.5" marker-end="url(#f)"/><text x="700" y="448" text-anchor="middle" font-size="13" font-weight="600" fill="#EF6C00">40 ms: no miro. Despues vuelvo a leer y confirmo.</text><line x1="250" y1="470" x2="1150" y2="470" stroke="#455A64" stroke-width="1.5"/><line x1="250.0" y1="470" x2="250.0" y2="476" stroke="#455A64" stroke-width="1.5"/><text x="250.0" y="492" text-anchor="middle" font-size="12" fill="#607D8B">0</text><line x1="400.0" y1="470" x2="400.0" y2="476" stroke="#455A64" stroke-width="1.5"/><text x="400.0" y="492" text-anchor="middle" font-size="12" fill="#607D8B">10</text><line x1="550.0" y1="470" x2="550.0" y2="476" stroke="#455A64" stroke-width="1.5"/><text x="550.0" y="492" text-anchor="middle" font-size="12" fill="#607D8B">20</text><line x1="700.0" y1="470" x2="700.0" y2="476" stroke="#455A64" stroke-width="1.5"/><text x="700.0" y="492" text-anchor="middle" font-size="12" fill="#607D8B">30</text><line x1="850.0" y1="470" x2="850.0" y2="476" stroke="#455A64" stroke-width="1.5"/><text x="850.0" y="492" text-anchor="middle" font-size="12" fill="#607D8B">40</text><line x1="1000.0" y1="470" x2="1000.0" y2="476" stroke="#455A64" stroke-width="1.5"/><text x="1000.0" y="492" text-anchor="middle" font-size="12" fill="#607D8B">50</text><line x1="1150.0" y1="470" x2="1150.0" y2="476" stroke="#455A64" stroke-width="1.5"/><text x="1150.0" y="492" text-anchor="middle" font-size="12" fill="#607D8B">60</text><text x="1160" y="492" font-size="12" fill="#607D8B">ms</text><text x="34.0" y="538" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#607D8B">Medido en simulacion: una sola pulsacion produce </tspan><tspan fill="#C62828">38 escrituras al LED en v2</tspan><tspan fill="#607D8B">  y  </tspan><tspan fill="#2E7D32">2 en v3</tspan><tspan fill="#607D8B">.</tspan></text>
</svg>
