<text x="34" y="40" font-size="19" font-weight="700" fill="#212121">Ejercicio 6 — cuatro estados, dos LEDs</text><text x="34" y="60" font-size="13" fill="#607D8B">Todas las transiciones son el MISMO evento. Lo unico que cambia es el estado, y la salida sale del estado (Moore).</text><text x="34.0" y="576" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">evento</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[guarda]</tspan><tspan fill="#212121"> </tspan><tspan fill="#C62828">/ accion</tspan><tspan fill="#78909C">     la guarda LEE, la accion ESCRIBE</tspan></text><rect x="130" y="150" rx="14" ry="14" width="260" height="82" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="260.0" y="185.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">TODO_APAGADO</text><text x="154.7" y="208.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / verde=OFF, rojo=OFF</tspan></text><circle cx="90" cy="191.0" r="7" fill="#455A64"/><line x1="97" y1="191.0" x2="124" y2="191.0" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><rect x="660" y="150" rx="14" ry="14" width="260" height="82" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="790.0" y="185.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">SOLO_VERDE</text><text x="688.6" y="208.0" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">entry</tspan><tspan fill="#C62828"> / verde=ON, rojo=OFF</tspan></text><rect x="660" y="390" rx="14" ry="14" width="260" height="82" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="790.0" y="425.0" text-anchor="middle" font-size="17" font