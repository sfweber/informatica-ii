<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<title>El lector de boton, con la ISR en vez del polling</title>
<defs>
  <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#455A64"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="34" y="40" font-size="19" font-weight="700" fill="#212121">El lector de boton, con la ISR en vez del polling</text><text x="34" y="60" font-size="13" fill="#607D8B">ejemplo 05: pin 21 + INPUT_PULLUP (presionado = LOW). Comparar con mef-antirrebote-lector.svg de la clase 14: cambian SOLO los dos eventos de reposo.</text><text x="34.0" y="616" text-anchor="start" font-size="13" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">evento</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[guarda]</tspan><tspan fill="#212121"> </tspan><tspan fill="#C62828">/ accion</tspan><tspan fill="#78909C">     la guarda LEE, la accion ESCRIBE</tspan></text><rect x="34" y="66" rx="8" ry="8" width="560" height="54" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/><text x="48.0" y="88" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#212121">ISR (CHANGE, cada flanco del pin 21, rebotes incluidos):  </tspan><tspan fill="#C62828">hayFlanco = 1</tspan></text><text x="48.0" y="108" text-anchor="start" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#78909C">anotar y salir. No toca el LED, no cambia estados, no llama a millis().</tspan></text><rect x="170" y="190" rx="14" ry="14" width="240" height="66" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="290.0" y="229.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonUp</text><circle cx="130" cy="223.0" r="7" fill="#455A64"/><line x1="137" y1="223.0" x2="164" y2="223.0" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><rect x="760" y="190" rx="14" ry="14" width="240" height="66" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="880.0" y="229.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonPressing</text><rect x="760" y="430" rx="14" ry="14" width="240" height="66" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="880.0" y="469.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonDown</text><rect x="170" y="430" rx="14" ry="14" width="240" height="66" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="290.0" y="469.0" text-anchor="middle" font-size="17" font-weight="600" fill="#212121" font-family="Consolas, DejaVu Sans Mono, monospace">buttonReleasing</text><path d="M410,212 L752,212" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="547.2" y="156" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">hayFlanco</tspan></text><text x="429.6" y="174" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ hayFlanco = 0, timeAntes = millis()</tspan></text><path d="M760,236 L418,236" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="475.8" y="286" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">after(40 ms)</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == HIGH]</tspan></text><text x="441.0" y="304" text-anchor="start" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#78909C">era un rebote (o un pulso menor a 40 ms)</tspan></text><path d="M955,256 L955,422" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="730.0" y="333.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">after(40 ms)</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == LOW]</tspan></text><text x="738.4" y="351.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ emite BOTON_PRESIONADO</tspan></text><path d="M760,452 L418,452" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="547.2" y="384" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">hayFlanco</tspan></text><text x="429.6" y="402" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ hayFlanco = 0, timeAntes = millis()</tspan></text><path d="M410,476 L752,476" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="480.0" y="526" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">after(40 ms)</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == LOW]</tspan></text><text x="538.2" y="544" text-anchor="start" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#78909C">era un rebote</tspan></text><path d="M215,430 L215,264" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#f)"/><text x="230.0" y="333.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#1565C0">after(40 ms)</tspan><tspan fill="#212121"> </tspan><tspan fill="#2E7D32">[pin == HIGH]</tspan></text><text x="230.0" y="351.0" text-anchor="start" font-size="14" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#C62828">/ emite BOTON_SOLTADO</tspan></text><text x="208.4" y="574" text-anchor="start" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#607D8B">En los dos after(40 ms) se hace hayFlanco = 0 ANTES de leer el pin: los rebotes de la espera se descartan,</tspan></text><text x="341.6" y="592" text-anchor="start" font-size="12" font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><tspan fill="#607D8B">y un flanco que caiga justo ahi queda anotado para el proximo estado.</tspan></text>
</svg>
